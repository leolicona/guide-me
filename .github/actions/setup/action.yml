name: setup
description: >-
  pnpm 10, Node 22 and a frozen-lockfile install — the one way every job of this repository
  installs (delivery-pipeline D8).

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 10

    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm

    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile
