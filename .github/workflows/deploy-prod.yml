name: Deploy Prod

# main → Prod. Gated by the GitHub "production" environment: add a Required Reviewer
# to it (Settings → Environments → production) and every run pauses for your manual
# approval before any migration or deploy step executes.
on:
  push:
    branches: [main]
    # Docs-only changes don't affect the workers — skip the deploy for them.
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Protection rules on this environment (required reviewer) create the approval gate.
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Last line of defense before touching production.
      - name: Test (api)
        run: pnpm test:api

      # passkey-auth D19 — BETTER_AUTH_SECRET lives in this GitHub environment ("production") and is copied
      # to the API Worker on every deploy, before anything changes. The API refuses to start without
      # it (src/auth/index.ts), so a missing or short secret stops the run here, with nothing
      # migrated or deployed. Each environment holds its own value (constitution VIII).
      - name: Sync BETTER_AUTH_SECRET to the API Worker (prod)
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          if [ "${#BETTER_AUTH_SECRET}" -lt 32 ]; then
            echo "::error::BETTER_AUTH_SECRET is missing or shorter than 32 characters in the 'production' environment"
            exit 1
          fi
          printf '%s' "$BETTER_AUTH_SECRET" | pnpm --filter api-turistear exec wrangler secret put BETTER_AUTH_SECRET --env production

      - name: Apply D1 migrations (prod)
        run: pnpm db:migrate:prod

      - name: Deploy API (prod)
        run: pnpm deploy:api:prod

      - name: Deploy App (prod)
        env:
          VITE_API_BASE_URL: https://api.turistearya.com
        run: pnpm deploy:app:prod
