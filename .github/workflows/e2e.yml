name: E2E

# Playwright journeys against a DEPLOYED environment. Deliberately NOT part of `verify`
# (docs/TESTING.md D7): a real browser at 90s timeouts would cost the merge queue far more than
# it catches, and Tiers 1–3 already gate every PR in seconds.
#
# Runs nightly and on demand, against dev. A pull request labelled `e2e` runs the same journeys
# against its own preview instead, inside preview.yml (delivery-pipeline D15).
on:
  schedule:
    # 08:00 UTC ≈ 02:00 in Cancún — after the dev deploys of the day, before anyone is selling.
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'App origin to test (defaults to app-dev)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # The suite seeds real data in dev's database, which every preview shares — so every journey
  # run, here or on a preview, queues in this one group and none overlaps (delivery-pipeline D15).
  group: e2e-dev-data
  cancel-in-progress: false

jobs:
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The `dev` environment holds the credentials; no Cloudflare tokens are needed — nothing deploys.
    environment: dev
    env:
      E2E_BASE_URL: ${{ github.event.inputs.base_url || 'https://app-dev.turistearya.com' }}
      E2E_API_BASE: ${{ vars.E2E_API_BASE || 'https://api-dev.turistearya.com' }}
      # passkey-auth T042 — each account signs in with its llave de acceso in Chrome's virtual
      # authenticator (app-turistear/e2e/README.md § The llaves de acceso). No password exists.
      E2E_AGENT_PASSKEY: ${{ secrets.E2E_AGENT_PASSKEY }}
      E2E_ADMIN_PASSKEY: ${{ secrets.E2E_ADMIN_PASSKEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Install Chromium
        run: pnpm --filter app-turistear exec playwright install --with-deps chromium

      - name: Run journeys
        run: pnpm --filter app-turistear test:e2e

      # Always upload: the trace/video of a failure is the whole reason to keep the report.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: app-turistear/e2e/.report
          retention-days: 14
