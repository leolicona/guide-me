name: Deploy Dev

# develop → Dev (automatic). Migrations are applied to the dev D1 BEFORE the workers
# ship, so the new schema is in place when the new code lands. Keep migrations additive
# and backward-compatible (D1 has no cross-statement transaction).
on:
  push:
    branches: [develop]
    # Docs-only changes don't affect the workers — skip the deploy for them.
    paths-ignore:
      - '**.md'

permissions:
  contents: read

# Never let two dev deploys race; queue them instead.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Bind this job to the GitHub "dev" environment (no protection rules).
    environment: dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Safety net: a broken develop branch never reaches the dev workers.
      - name: Test (api)
        run: pnpm test:api

      # passkey-auth D19 — BETTER_AUTH_SECRET lives in this GitHub environment ("dev") and is copied
      # to the API Worker on every deploy, before anything changes. The API refuses to start without
      # it (src/auth/index.ts), so a missing or short secret stops the run here, with nothing
      # migrated or deployed. Each environment holds its own value (constitution VIII).
      - name: Sync BETTER_AUTH_SECRET to the API Worker (dev)
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          if [ "${#BETTER_AUTH_SECRET}" -lt 32 ]; then
            echo "::error::BETTER_AUTH_SECRET is missing or shorter than 32 characters in the 'dev' environment"
            exit 1
          fi
          printf '%s' "$BETTER_AUTH_SECRET" | pnpm --filter api-turistear exec wrangler secret put BETTER_AUTH_SECRET --env dev

      - name: Apply D1 migrations (dev)
        run: pnpm db:migrate:dev

      - name: Deploy API (dev)
        run: pnpm deploy:api:dev

      - name: Deploy App (dev)
        env:
          VITE_API_BASE_URL: https://api-dev.turistearya.com
        run: pnpm deploy:app:dev
