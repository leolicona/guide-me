name: Deploy Dev

# main → dev, on every push (delivery-pipeline D9). `verify` runs whole first — the same gate as
# every pull request, never a subset (D8) — then dev's D1 migrations, then the API, then the app,
# so the new schema is in place when the new code lands. Keep migrations additive and
# backward-compatible (D1 has no cross-statement transaction).
#
# Documentation-only pushes deploy too: a release takes only a main commit whose run of THIS
# workflow finished green (deploy-prod.yml, D10), so every commit on main must be able to earn one.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Never let two dev deploys race; queue them instead.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/verify

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    # Bind this job to the GitHub "dev" environment (no protection rules).
    environment: dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Apply D1 migrations (dev)
        run: pnpm db:migrate:dev

      - name: Deploy API (dev)
        run: pnpm deploy:api:dev

      - name: Deploy App (dev)
        env:
          VITE_API_BASE_URL: https://api-dev.turistearya.com
        run: pnpm deploy:app:dev

      # Every host is tried before the step fails, so one red log names each one that did not
      # answer; the wait covers a certificate race after a custom-domain change (D9).
      - name: Smoke
        run: |
          probe() {
            for i in $(seq 1 10); do
              if curl -sf -o /dev/null --max-time 20 "$1"; then echo "answered: $1"; return 0; fi
              echo "not up yet (attempt $i): $1"; sleep 30
            done
            echo "::error::$1 did not answer in 5 minutes"; return 1
          }
          failed=0
          probe https://api-dev.turistearya.com/ || failed=1
          probe https://app-dev.turistearya.com/ || failed=1
          exit $failed
