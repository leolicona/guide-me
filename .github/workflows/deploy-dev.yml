name: Deploy Dev

# main → dev, on every push (delivery-pipeline D9). `verify` runs whole first — the same gate as
# every pull request, never a subset (D8) — then dev's D1 migrations, then the API, then the app,
# so the new schema is in place when the new code lands. Keep migrations additive and
# backward-compatible (D1 has no cross-statement transaction).
#
# Documentation-only pushes deploy too: a release takes only a main commit whose run of THIS
# workflow finished green (deploy-prod.yml, D10), so every commit on main must be able to earn one.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Never let two dev deploys race; queue them instead.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/verify

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    # Bind this job to the GitHub "dev" environment (no protection rules).
    environment: dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # passkey-auth, constitution VIII (v1.4.0) — the API's secrets are managed in this GitHub
      # environment ("dev") and land on the Worker with the version this run deploys
      # (`wrangler deploy --secrets-file`, additive: a secret the environment does not hold keeps
      # the Worker's current value). BETTER_AUTH_SECRET is required — the API refuses to start
      # without 32+ characters — so a missing one stops the run here, before anything changes. The
      # file stays in the runner's temp and is never printed.
      #
      # devolada-transfer-verification D17 — DEVOLADA_CREDENTIAL_KEY encrypts every stored Devolada
      # credential: 32 random bytes, base64 (`openssl rand -base64 32`), generated once for this
      # environment and never pasted again (a different value makes every stored credential
      # unreadable). A value that is present but does not decode to 32 bytes stops the run before it
      # migrates; an absent one keeps the Worker's current value.
      - name: Secrets for the API (dev)
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          QR_SECRET: ${{ secrets.QR_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DEVOLADA_CREDENTIAL_KEY: ${{ secrets.DEVOLADA_CREDENTIAL_KEY }}
        run: |
          set -euo pipefail
          if [ "${#BETTER_AUTH_SECRET}" -lt 32 ]; then
            echo "::error::BETTER_AUTH_SECRET is missing or shorter than 32 characters in the 'dev' environment. Nothing was migrated or deployed."
            exit 1
          fi
          if [ -n "$DEVOLADA_CREDENTIAL_KEY" ] && ! node -e 'const k = process.env.DEVOLADA_CREDENTIAL_KEY; process.exit(/^[A-Za-z0-9+\/]{43}=$/.test(k) && Buffer.from(k, "base64").length === 32 ? 0 : 1)'; then
            echo "::error::DEVOLADA_CREDENTIAL_KEY in the 'dev' environment does not decode to 32 bytes (openssl rand -base64 32). Nothing was migrated or deployed."
            exit 1
          fi
          for name in QR_SECRET RESEND_API_KEY DEVOLADA_CREDENTIAL_KEY; do
            [ -n "${!name}" ] || echo "::notice::$name is not in the 'dev' environment; the Worker keeps its current value."
          done
          node -e 'const e = process.env; const s = {}; for (const k of ["BETTER_AUTH_SECRET", "QR_SECRET", "RESEND_API_KEY", "DEVOLADA_CREDENTIAL_KEY"]) if (e[k]) s[k] = e[k]; process.stdout.write(JSON.stringify(s))' \
            > "$RUNNER_TEMP/api-secrets.json"

      - name: Apply D1 migrations (dev)
        run: pnpm db:migrate:dev

      - name: Deploy API (dev)
        run: pnpm deploy:api:dev --secrets-file "$RUNNER_TEMP/api-secrets.json"

      - name: Deploy App (dev)
        env:
          VITE_API_BASE_URL: https://api-dev.turistearya.com
        run: pnpm deploy:app:dev

      # Every host is tried before the step fails, so one red log names each one that did not
      # answer; the wait covers a certificate race after a custom-domain change (D9).
      - name: Smoke
        run: |
          probe() {
            for i in $(seq 1 10); do
              if curl -sf -o /dev/null --max-time 20 "$1"; then echo "answered: $1"; return 0; fi
              echo "not up yet (attempt $i): $1"; sleep 30
            done
            echo "::error::$1 did not answer in 5 minutes"; return 1
          }
          failed=0
          probe https://api-dev.turistearya.com/ || failed=1
          probe https://app-dev.turistearya.com/ || failed=1
          exit $failed
