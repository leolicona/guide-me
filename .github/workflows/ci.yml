name: CI

# The merge gate: every pull request into main runs `verify`, the one definition of the gate
# (delivery-pipeline D8). No deploy and no credential, so it runs the same for forks. It never
# listens to `labeled`: a label must not re-run the required check and turn a red one into a
# skipped one, which GitHub counts as passing (delivery-pipeline D6).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/verify
