name: CI

# Merge gate for every PR into develop or main: install, lint, test, and build both
# workspaces. No deploy, no Cloudflare credentials needed.
on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Specs and the design system live in leolicona/guide-me-docs (docs/PROCESS.md § Two
      # repositories, one unit of work). Fail loudly if a docs/ or .design/ folder creeps back in.
      - name: Docs live in guide-me-docs
        run: |
          if [ -e docs ] || [ -e .design ]; then
            echo "::error::docs/ and .design/ belong in leolicona/guide-me-docs, not here."
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (app)
        run: pnpm lint:app

      - name: Test (app)
        run: pnpm test:app

      - name: Test (api)
        run: pnpm test:api

      - name: Build (api)
        run: pnpm build:api

      - name: Build (app)
        run: pnpm build:app
