name: CI

# Merge gate for every PR into develop or main: install, lint, test, and build both
# workspaces. No deploy, no Cloudflare credentials needed.
on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The pre-Spec-Kit corpus is archived in leolicona/guide-me-docs (CLAUDE.md). Old code
      # comments still cite docs/… and .design/…, so it is easy to recreate them here by habit;
      # new specs belong in specs/NNN-slug/ (Spec Kit). Fail loudly if either folder creeps back.
      - name: Corpus stays archived
        run: |
          if [ -e docs ] || [ -e .design ]; then
            echo "::error::docs/ and .design/ are archived in leolicona/guide-me-docs; new specs go in specs/NNN-slug/."
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (app)
        run: pnpm lint:app

      - name: Test (app)
        run: pnpm test:app

      - name: Test (api)
        run: pnpm test:api

      - name: Build (api)
        run: pnpm build:api

      - name: Build (app)
        run: pnpm build:app
