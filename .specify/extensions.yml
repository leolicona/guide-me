installed:
- bug
- debt
- design
settings:
  auto_execute_hooks: true
hooks:
  after_constitution:
  - extension: design
    command: speckit.design.foundations
    enabled: true
    optional: true
    priority: 10
    prompt: Does this project have a UI? Define its visual foundations now, before
      the first feature?
    description: Offer to define visual foundations right after the constitution
    condition: null
